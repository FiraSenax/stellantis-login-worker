name: Report a problem
description: Report an installation, startup or login-helper failure.
body:
  - type: markdown
    attributes:
      value: |
        Report vehicle entities or commands to the main Stellantis Vehicles integration. Never include passwords, tokens, authorization codes, callback URLs or raw login-page exports here. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Add-on version
      placeholder: 0.3.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      options: [amd64, aarch64, Unknown]
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant and integration versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the last login phase and numeric error if available. Describe what you expected instead. Review any log excerpt before posting.
    validations:
      required: true
